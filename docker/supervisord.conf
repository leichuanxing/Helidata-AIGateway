[unix_http_server]
file=/run/supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/data/logs/postgresql.log
stderr_logfile=/data/logs/postgresql-error.log
[program:redis]
command=/usr/bin/redis-server /run/redis.conf
user=redis
priority=20
autorestart=true
stopwaitsecs=30
stdout_logfile=/data/logs/redis.log
stderr_logfile=/data/logs/redis-error.log
[program:uvicorn]
environment=HOME="/home/gateway",USER="gateway"
command=/usr/local/bin/python -m app.services.serve
directory=/app/backend
user=gateway
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=35
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nginx]
command=/usr/sbin/nginx -c /run/nginx.conf -g "daemon off;"
priority=40
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/data/logs/nginx.log
stderr_logfile=/data/logs/nginx-supervisor-error.log
